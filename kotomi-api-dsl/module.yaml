product: jvm/lib

apply:
  - //templates/jvm.module-template.yaml
  - //templates/serialization.module-template.yaml
  - //templates/publishing.module-template.yaml

description: "Model and DSL for OpenApi 3.2"

dependencies:
  - $libs.kotlinx.serialization.json
  - $libs.kotlinpoet
  - $libs.kotaml
  - $libs.kotlin.reflect

test-dependencies:
  - $libs.junit.jupiter
  - $libs.logback
  - //kotomi-utils-slf4j
  - $libs.json.schema.validator

settings:
  publishing:
    pom:
      name: "Kotomi OpenApi 3.2 DSL"

plugins:
  bcv: enabled
