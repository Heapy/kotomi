product: jvm/lib

apply:
  - //templates/jvm.module-template.yaml
  - //templates/publishing.module-template.yaml

description: "SLF4J ServiceProvider bridge for Kotomi Logging"

dependencies:
  - //kotomi-logging-api: exported
  - $libs.slf4j.api: exported
  - $libs.junit.platform.launcher: runtime-only

settings:
  kotlin:
    allWarningsAsErrors: false
  publishing:
    pom:
      name: "Kotomi Logging SLF4J Bridge"

plugins:
  bcv: enabled

test-dependencies:
  - $libs.junit.jupiter
