product: jvm/lib

apply:
  - //templates/jvm.module-template.yaml
  - //templates/publishing.module-template.yaml

description: "Web UI renderer for OpenApi 3.2 documents"

dependencies:
  - //kotomi-api-dsl
  - $libs.kotlinx.html
  - $libs.commonmark
  - $libs.kotlinx.serialization.json

test-dependencies:
  - $libs.junit.jupiter
  - $libs.kotaml
  - $libs.logback
  - //kotomi-utils-slf4j

settings:
  jvm:
    test:
      freeJvmArgs: [-Xmx2048m]
  publishing:
    pom:
      name: "Kotomi OpenApi 3.2 DSL UI"

plugins:
  bcv: enabled
