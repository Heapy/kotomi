product: jvm/lib

apply:
  - //templates/jvm.module-template.yaml
  - //templates/runtime.module-template.yaml
  - //templates/publishing.module-template.yaml

description: "java.util.logging Handler bridge for Kotomi Logging"

dependencies:
  - //kotomi-logging-api: exported
  - //kotomi-runtime
  - $libs.junit.platform.launcher: runtime-only

settings:
  kotlin:
    allWarningsAsErrors: false
  publishing:
    pom:
      name: "Kotomi Logging JUL Bridge"

plugins:
  bcv: enabled

test-dependencies:
  - $libs.junit.jupiter
