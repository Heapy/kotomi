repositories:
  - url: mavenLocal
    publish: true

settings:
  publishing:
    enabled: true
    group: io.heapy.kotomi
    version: 1.2.0
    # Local development and CI use unsigned Maven Local artifacts.
    # For a release, set mavenCentral: enabled and signArtifacts: true.
    signArtifacts: false
    publishSources: true
    pom:
      url: https://github.com/Heapy/kotomi
      licenses:
        - name: Apache-2.0
          url: https://spdx.org/licenses/Apache-2.0.html
      developers:
        - id: ruslan.ibrahimau
          name: Ruslan Ibrahimau
          email: ruslan@heapy.io
      scm:
        url: https://github.com/Heapy/kotomi
        connection: scm:git:https://github.com/Heapy/kotomi.git
        developerConnection: scm:git:ssh://github.com/Heapy/kotomi.git
