plugins:
  runtime-compiler: enabled

settings:
  kotlin:
    # Toolchain 0.13 cannot model a local compiler-plugin dependency. The build task
    # orders its JAR before consumers; full compilation avoids stale plugin output.
    compileIncrementally: false
    freeCompilerArgs:
      - -Xplugin=build/tasks/_kotomi-runtime-compiler_jarJvm/kotomi-runtime-compiler-jvm.jar
